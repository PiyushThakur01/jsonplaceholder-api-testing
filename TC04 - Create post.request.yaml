$kind: http-request
url: https://jsonplaceholder.typicode.com/posts
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "My test post",
      "body": "This is a test body",
      "userId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 4000
