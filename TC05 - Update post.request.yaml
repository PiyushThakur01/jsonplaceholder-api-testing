$kind: http-request
url: https://jsonplaceholder.typicode.com/posts/1
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": 1,
      "title": "Updated title",
      "body": "Updated body",
      "userId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
